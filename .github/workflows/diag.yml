name: Diagnose JPM
on:
  push:
    branches: [fix/jpm-load-error]
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -q -r api/requirements.txt
      - run: python .github/diag/profile.py GS,JPM,CAT,AAPL
