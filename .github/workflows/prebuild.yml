# Builds the API's ready-made results for S&P 500 companies on GitHub's machines (much faster than Render's free
# tenth of a CPU) and publishes them as the "prebuilt-data" release. The API downloads it (see api/prebuilt.py).
# Runs weekly, whenever the lookup code changes on main, and on demand from Actions > Prebuild S&P 500 data.
name: Prebuild S&P 500 data

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: ["api/sec_core.py", "api/peers.py", "api/prebuild.py", "api/data/**", "api/requirements.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -q -r api/requirements.txt
      - name: Run the four lookups for every company
        working-directory: api
        run: python prebuild.py
      - name: Publish as the prebuilt-data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view prebuilt-data >/dev/null 2>&1 || \
            gh release create prebuilt-data --title "Prebuilt S&P 500 data" --latest=false \
              --notes "Ready-made API results, rebuilt weekly by the Prebuild S&P 500 data workflow. Not a software release."
          gh release upload prebuilt-data api/prebuilt.tar.gz --clobber
