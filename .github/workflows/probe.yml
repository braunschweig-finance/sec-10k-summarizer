name: Probe (temporary)
on:
  push:
    branches-ignore: [main]
    paths: [".github/workflows/probe.yml", "scratch/probe.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -q httpx pandas openpyxl lxml
      - run: python scratch/probe.py
