name: tmp valuation data
on:
  push:
    branches: [tmp/valuation-data]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -q -r api/requirements.txt
      - working-directory: api
        run: python dev_valuation_dump.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view valuation-dev-data >/dev/null 2>&1 || gh release create valuation-dev-data --title "Temporary valuation research data" --latest=false --prerelease --notes "Temporary, safe to delete."
          gh release upload valuation-dev-data api/valuation_dev.json.gz --clobber
